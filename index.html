<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anniversary Countdown</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 120%, #4a2150 0%, #241438 45%, #120a22 100%);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    color: #fff;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .stage {
    position: fixed; left: 0; right: 0; top: 9%;
    text-align: center; pointer-events: none; padding: 0 16px;
    text-shadow: 0 2px 18px rgba(0,0,0,.55);
  }
  .en {
    font-size: clamp(11px, 2.8vw, 16px); letter-spacing: .38em; opacity: 0;
    animation: rise 2s ease 2.4s forwards;
  }
  .main {
    margin: 12px 0 18px; font-size: clamp(22px, 6vw, 40px); letter-spacing: .12em; opacity: 0;
    animation: rise 2.2s ease 3s forwards;
  }
  .grid {
    display: inline-flex; gap: clamp(8px, 2.4vw, 20px); opacity: 0;
    animation: rise 2.2s ease 3.8s forwards;
  }
  .cell {
    min-width: clamp(58px, 17vw, 112px); padding: clamp(10px, 2.4vw, 18px) 6px;
    background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.22);
    border-radius: 18px; backdrop-filter: blur(6px);
  }
  .num {
    display: block; font-size: clamp(30px, 9vw, 64px); line-height: 1.1;
    font-variant-numeric: tabular-nums; letter-spacing: .04em;
  }
  .unit { display: block; margin-top: 4px; font-size: clamp(10px, 2.6vw, 14px); letter-spacing: .25em; opacity: .8; }
  .date {
    margin-top: 16px; font-size: clamp(12px, 3vw, 16px); letter-spacing: .2em; opacity: 0;
    animation: rise 2.2s ease 4.6s forwards;
  }
  .done { display: none; }
  body.finished .grid, body.finished .main { display: none; }
  body.finished .done {
    display: block; font-size: clamp(30px, 8.5vw, 60px); letter-spacing: .12em; margin: 14px 0 8px;
    animation: rise 2.4s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: .95; transform: none; }
  }
  .hint {
    position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
    font-size: 12px; letter-spacing: .15em; opacity: 0; pointer-events: none;
    animation: hint 1s ease 7s forwards;
  }
  @keyframes hint { to { opacity: .55; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="stage">
  <div class="en" id="en">COUNTDOWN TO OUR 1ST ANNIVERSARY</div>
  <div class="main" id="main">1周年まで あと</div>
  <div class="grid" id="grid">
    <div class="cell"><span class="num" id="d">0</span><span class="unit">DAYS</span></div>
    <div class="cell"><span class="num" id="h">00</span><span class="unit">HOURS</span></div>
    <div class="cell"><span class="num" id="m">00</span><span class="unit">MIN</span></div>
    <div class="cell"><span class="num" id="s">00</span><span class="unit">SEC</span></div>
  </div>
  <div class="done" id="done">Happy 1st Anniversary</div>
  <div class="date" id="date"></div>
</div>
<div class="hint">画面をタップすると、花が増えます</div>

<script>
(() => {
  /* ===== ここを書き換える =====
     記念日の日付(日本時間・0時ちょうど)。例: '2026-11-03'
     URLの末尾に ?date=2026-11-03 を付けて試すこともできます */
  const ANNIVERSARY = '2026-10-12';
  const NAME = 'Haru-chan';
  /* ============================ */

  const dateStr = new URLSearchParams(location.search).get('date') || ANNIVERSARY;
  const TARGET = new Date(dateStr + 'T00:00:00+09:00').getTime();
  const $ = id => document.getElementById(id);
  $('date').textContent = dateStr.replace(/-/g, '.') + (NAME ? '  ―  ' + NAME + ' へ' : '');

  let finished = false;
  function tick() {
    const diff = TARGET - Date.now();
    if (diff <= 0) {
      if (!finished) { finished = true; document.body.classList.add('finished'); $('en').textContent = '1ST ANNIVERSARY'; burst(); }
      return;
    }
    const sec = Math.floor(diff / 1000);
    $('d').textContent = Math.floor(sec / 86400);
    $('h').textContent = String(Math.floor(sec % 86400 / 3600)).padStart(2, '0');
    $('m').textContent = String(Math.floor(sec % 3600 / 60)).padStart(2, '0');
    $('s').textContent = String(sec % 60).padStart(2, '0');
  }

  /* ===== 花のアニメーション ===== */
  const cv = $('c'), ctx = cv.getContext('2d');
  let W, H, DPR, scale;
  const HUES = [335, 345, 355, 10, 25, 45, 280, 300];
  let flowers = [], petals = [], t0 = performance.now();

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    scale = Math.max(0.6, Math.min(W, H) / 800);
  }
  addEventListener('resize', resize);
  resize();

  const rnd = (a, b) => a + Math.random() * (b - a);
  const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
  const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const clamp01 = x => Math.max(0, Math.min(1, x));

  function makeFlower(x, y, delay) {
    return {
      x, y, delay,
      R: rnd(30, 62) * scale,
      n: Math.floor(rnd(5, 9)),
      hue: HUES[Math.floor(Math.random() * HUES.length)],
      dur: rnd(1.8, 2.6),
      bend: rnd(-60, 60) * scale,
      phase: rnd(0, Math.PI * 2),
      rot: rnd(0, Math.PI * 2),
    };
  }

  function seed() {
    flowers = []; petals = [];
    const count = Math.round(Math.max(10, Math.min(22, W / 70)));
    for (let i = 0; i < count; i++) {
      const x = ((i + rnd(0.1, 0.9)) / count) * W;
      const y = rnd(H * 0.52, H * 0.88);
      flowers.push(makeFlower(x, y, 0.2 + Math.random() * 3.6));
    }
    for (let i = 0; i < 28; i++) {
      petals.push({
        x: rnd(0, W), y: rnd(-H, 0), s: rnd(4, 9) * scale,
        vy: rnd(14, 34), vx: rnd(-10, 10), a: rnd(0, 6.28), va: rnd(-1, 1),
        hue: HUES[Math.floor(Math.random() * HUES.length)],
      });
    }
    t0 = performance.now();
  }

  function burst() {
    const time = (performance.now() - t0) / 1000;
    for (let i = 0; i < 28; i++) {
      flowers.push(makeFlower(rnd(0, W), rnd(H * 0.2, H * 0.88), time + rnd(0, 2.5)));
    }
  }

  function stemPoint(f, u) {
    const sx = f.x, sy = H + 10;
    const cx = f.x + f.bend, cy = (f.y + sy) / 2;
    const a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
    return { x: a * sx + b * cx + c * f.x, y: a * sy + b * cy + c * f.y };
  }

  function drawStem(f, p, time) {
    const sp = easeOutCubic(clamp01(p / 0.45));
    if (sp <= 0) return;
    ctx.strokeStyle = 'hsl(140, 38%, 38%)';
    ctx.lineWidth = 3 * scale;
    ctx.lineCap = 'round';
    ctx.beginPath();
    const steps = 24;
    for (let i = 0; i <= steps; i++) {
      const pt = stemPoint(f, (i / steps) * sp);
      i ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y);
    }
    ctx.stroke();
    const lp = easeOutCubic(clamp01((p - 0.25) / 0.35));
    if (lp > 0) {
      const pt = stemPoint(f, 0.55);
      const dir = f.bend > 0 ? -1 : 1;
      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.rotate(dir * (0.9 + Math.sin(time + f.phase) * 0.05));
      ctx.scale(lp, lp);
      ctx.fillStyle = 'hsl(140, 40%, 42%)';
      ctx.beginPath();
      const L = 34 * scale, w = 11 * scale;
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-w, -L * 0.3, -w, -L * 0.8, 0, -L);
      ctx.bezierCurveTo(w, -L * 0.8, w, -L * 0.3, 0, 0);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawPetalRing(n, len, wid, offset, light, hue, bloom, sway) {
    for (let i = 0; i < n; i++) {
      ctx.save();
      ctx.rotate(offset + (i / n) * Math.PI * 2 + sway);
      const L = len * bloom, w = wid * bloom;
      const g = ctx.createLinearGradient(0, 0, 0, -L);
      g.addColorStop(0, `hsl(${hue}, 85%, ${light - 14}%)`);
      g.addColorStop(1, `hsl(${hue}, 85%, ${light + 8}%)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-w, -L * 0.25, -w * 1.1, -L * 0.85, 0, -L);
      ctx.bezierCurveTo(w * 1.1, -L * 0.85, w, -L * 0.25, 0, 0);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawHead(f, p, time) {
    const bp = clamp01((p - 0.4) / 0.6);
    if (bp <= 0) return;
    const bloom = Math.max(0, easeOutBack(bp));
    const sway = Math.sin(time * 0.8 + f.phase) * 0.04;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot * 0.1);
    ctx.shadowColor = `hsla(${f.hue}, 90%, 70%, .55)`;
    ctx.shadowBlur = 18 * scale * bp;
    drawPetalRing(f.n, f.R, f.R * 0.38, 0, 74, f.hue, bloom, sway);
    ctx.shadowBlur = 0;
    drawPetalRing(f.n, f.R * 0.66, f.R * 0.28, Math.PI / f.n, 84, f.hue, bloom, -sway);
    ctx.fillStyle = 'hsl(45, 95%, 62%)';
    ctx.beginPath();
    ctx.arc(0, 0, f.R * 0.16 * bloom, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function frame(now) {
    const time = (now - t0) / 1000;
    const dt = 1 / 60;
    ctx.clearRect(0, 0, W, H);

    const sorted = flowers.slice().sort((a, b) => a.y - b.y);
    for (const f of sorted) {
      const p = clamp01((time - f.delay) / f.dur);
      if (p > 0) drawStem(f, p, time);
    }
    for (const f of sorted) {
      const p = clamp01((time - f.delay) / f.dur);
      if (p > 0) drawHead(f, p, time);
    }

    if (time > 2.5) {
      for (const q of petals) {
        q.y += q.vy * dt; q.x += (q.vx + Math.sin(time + q.a) * 12) * dt; q.a += q.va * dt;
        if (q.y > H + 20) { q.y = -20; q.x = rnd(0, W); }
        ctx.save();
        ctx.translate(q.x, q.y);
        ctx.rotate(q.a);
        ctx.globalAlpha = 0.65;
        ctx.fillStyle = `hsl(${q.hue}, 85%, 80%)`;
        ctx.beginPath();
        ctx.ellipse(0, 0, q.s, q.s * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
    requestAnimationFrame(frame);
  }

  addEventListener('pointerdown', e => {
    const time = (performance.now() - t0) / 1000;
    flowers.push(makeFlower(e.clientX, Math.min(e.clientY, H * 0.9), time));
  });

  seed();
  tick();
  setInterval(tick, 250);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
